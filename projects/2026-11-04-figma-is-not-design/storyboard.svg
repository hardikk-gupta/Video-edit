<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1415" viewBox="0 0 1600 1415" role="img" aria-labelledby="title desc">
  <title id="title">Storyboard: Figma is useful. Design is bigger.</title>
  <desc id="desc">Eight connected vertical video frames. A vermilion route starts as a Figma artboard, travels through a user flow, UX questions, reference study, coding agents, and human judgment. A presenter remains in the lower part of every frame.</desc>
  <defs>
    <style>
      .paper{fill:#f1eee7}.ink{fill:#292823}.muted{fill:#777267}.red{fill:#c85e46}.blue{fill:#566a92}.rule{stroke:#d3cdc2;stroke-width:1}
      .label{font:700 17px 'Arial',sans-serif;letter-spacing:1.2px}.small{font:14px 'Arial',sans-serif}.tiny{font:12px 'Arial',sans-serif}
      .headline{font:600 21px Georgia,serif}.route{fill:none;stroke:#c85e46;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .wire{fill:none;stroke:#777267;stroke-width:1.5}.node{fill:#f1eee7;stroke:#c85e46;stroke-width:3}
      .frame{fill:#f1eee7;stroke:#292823;stroke-width:2}.screen{fill:#e8e3d9;stroke:#b8b1a4;stroke-width:1}
      .speaker{fill:#292823}.speakerline{stroke:#777267;stroke-width:1;opacity:.7}.speakertext{fill:#f4f0e8;font:12px 'Arial',sans-serif;letter-spacing:.5px}
    </style>
    <g id="person">
      <circle cx="0" cy="-3" r="19" fill="#b8b1a4"/>
      <path d="M-28 49 Q-27 20 0 19 Q27 20 28 49Z" fill="#777267"/>
      <path d="M-15-6 Q0-20 15-6" fill="none" stroke="#292823" stroke-width="3"/>
    </g>
    <g id="framebase">
      <rect x="0" y="0" width="330" height="587" rx="9" class="paper" stroke="#b8b1a4" stroke-width="1.5"/>
      <path d="M0 340 H330 V587 H0Z" class="speaker"/>
      <path d="M0 340 H330" class="speakerline"/>
      <use href="#person" transform="translate(165 449) scale(1.18)"/>
      <text x="165" y="548" text-anchor="middle" class="speakertext">HARDIK · PRESENTER PANEL</text>
    </g>
  </defs>
  <rect width="1600" height="1415" fill="#e6e1d8"/>
  <text x="54" y="58" class="headline" font-size="32">ONE CONNECTED DESIGN MAP</text>
  <text x="54" y="88" class="small muted">8 storyboard beats · 9:16 frame · upper 58% visual map / lower 42% presenter</text>
  <text x="1544" y="58" text-anchor="end" class="label muted">PROPOSAL · ENGLISH ONLY</text>

  <!-- The same red route is drawn across every panel; each crop advances one continuous story. -->
  <g transform="translate(48 135)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">01 · 0:00–0:04.5</text>
    <text x="18" y="68" class="headline">Figma is useful.</text>
    <text x="18" y="96" class="small">Knowing the tool ≠ knowing design.</text>
    <rect x="24" y="132" width="145" height="121" rx="5" class="frame"/>
    <rect x="36" y="145" width="121" height="17" rx="3" class="screen"/>
    <rect x="36" y="171" width="77" height="9" rx="3" fill="#b8b1a4"/>
    <rect x="36" y="189" width="115" height="9" rx="3" fill="#b8b1a4"/>
    <rect x="36" y="212" width="53" height="24" rx="4" class="blue"/>
    <text x="46" y="229" class="tiny" fill="#fff">BUTTON</text>
    <path d="M145 218 C186 218 181 163 213 163 L280 163" class="route"/>
    <circle cx="213" cy="163" r="7" class="node"/>
    <text x="222" y="145" class="label red">WHY?</text>
    <text x="18" y="286" class="tiny muted">Tool fluency opens into a design question.</text>
  </g>
  <g transform="translate(432 135)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">02 · 0:04.5–0:11.2</text>
    <text x="18" y="68" class="headline">Experiences &amp; screens</text>
    <text x="18" y="96" class="small">AI · DESIGN · LIFE</text>
    <path d="M-14 163 H34 C67 163 58 132 94 132 H151 C191 132 177 192 222 192 H344" class="route"/>
    <circle cx="94" cy="132" r="7" class="node"/><circle cx="222" cy="192" r="7" class="node"/>
    <path d="M87 143 l-14 20 14 20 14-20Z" fill="none" stroke="#566a92" stroke-width="2"/>
    <rect x="195" y="126" width="50" height="62" rx="3" fill="none" stroke="#566a92" stroke-width="2"/>
    <path d="M204 139h32M204 149h26" class="wire"/>
    <text x="18" y="260" class="tiny muted">Same map. Introduction rides the route.</text>
  </g>
  <g transform="translate(816 135)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">03 · 0:11.2–0:15.3</text>
    <text x="18" y="68" class="headline">Explore. Map. Share.</text>
    <text x="18" y="96" class="small">Figma helps ideas take shape.</text>
    <path d="M-12 169 H48 L102 143 L163 172 L222 139 L343 169" class="route"/>
    <circle cx="48" cy="169" r="6" class="node"/><circle cx="163" cy="172" r="6" class="node"/><circle cx="222" cy="139" r="6" class="node"/>
    <rect x="28" y="113" width="43" height="32" rx="3" class="screen"/><rect x="142" y="187" width="43" height="32" rx="3" class="screen"/><rect x="204" y="102" width="43" height="32" rx="3" class="screen"/>
    <path d="M38 124h23M38 132h18M152 198h23M152 206h17M214 113h23M214 121h15" class="wire"/>
    <text x="18" y="260" class="tiny muted">Idea notes connect into one user flow.</text>
  </g>
  <g transform="translate(1200 135)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">04 · 0:15.3–0:24.5</text>
    <text x="18" y="68" class="headline">Ask what the screen does.</text>
    <text x="18" y="96" class="small">Problem · next step · purpose</text>
    <rect x="30" y="119" width="131" height="132" rx="5" class="frame"/>
    <rect x="42" y="131" width="107" height="33" rx="3" class="screen"/><text x="48" y="152" class="tiny">NEED</text>
    <rect x="42" y="176" width="107" height="29" rx="3" class="screen"/><text x="48" y="195" class="tiny">NEXT STEP</text>
    <rect x="42" y="216" width="71" height="23" rx="4" class="blue"/><text x="49" y="232" class="tiny" fill="#fff">ACTION</text>
    <path d="M-12 233 H42 L76 221 L120 221 L160 190 L207 169 L344 169" class="route"/>
    <circle cx="76" cy="221" r="5" class="node"/><circle cx="207" cy="169" r="5" class="node"/>
    <text x="174" y="146" class="tiny red">WHY HERE?</text>
    <text x="18" y="278" class="tiny muted">Follow each question to its element.</text>
  </g>

  <g transform="translate(48 770)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">05 · 0:24.5–0:32.8</text>
    <text x="18" y="68" class="headline">Study real references.</text>
    <text x="18" y="96" class="small">Ask why one choice works better.</text>
    <path d="M-12 199 H26 L65 157 L134 157 L189 197 L239 161 L343 161" class="route"/>
    <rect x="33" y="117" width="51" height="69" rx="3" class="screen"/><rect x="92" y="117" width="51" height="69" rx="3" class="screen"/><rect x="151" y="117" width="51" height="69" rx="3" class="screen"/>
    <path d="M41 130h35M41 139h25M100 130h35M100 139h25M159 130h35M159 139h25" class="wire"/>
    <circle cx="68" cy="160" r="7" fill="none" stroke="#c85e46" stroke-width="2"/><circle cx="127" cy="160" r="7" fill="none" stroke="#c85e46" stroke-width="2"/><circle cx="186" cy="160" r="7" fill="none" stroke="#c85e46" stroke-width="2"/>
    <text x="18" y="244" class="tiny red">REFERENCE IMAGES TO SOURCE + CREDIT</text>
    <text x="18" y="267" class="tiny muted">Illustrative placeholders, not real screenshots.</text>
  </g>
  <g transform="translate(432 770)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">06 · 0:32.8–0:43.0</text>
    <text x="18" y="68" class="headline">A clear direction can ship.</text>
    <text x="18" y="96" class="small">Claude Code · Codex · Cursor</text>
    <path d="M-12 177 H50 L104 177 L166 144 L218 144 L266 177 L344 177" class="route"/>
    <rect x="32" y="120" width="73" height="60" rx="4" class="screen"/>
    <text x="41" y="140" class="tiny">INTENT</text><path d="M41 150h52M41 158h42" class="wire"/>
    <path d="M129 125l-10 22h12l-8 21 24-29h-13l8-14Z" fill="#566a92"/>
    <rect x="216" y="117" width="63" height="73" rx="4" class="frame"/><rect x="225" y="127" width="45" height="15" rx="2" class="blue"/><path d="M225 151h45M225 159h31M225 167h40" class="wire"/>
    <text x="18" y="248" class="tiny muted">Prompt → implementation → same screen.</text>
  </g>
  <g transform="translate(816 770)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">07 · 0:43.0–0:49.2</text>
    <text x="18" y="68" class="headline">The person still decides.</text>
    <text x="18" y="96" class="small">Choose, test, and reconnect.</text>
    <path d="M-12 171 H91 L142 129 L196 171 L248 214 L343 171" class="route"/>
    <circle cx="91" cy="171" r="7" class="node"/><circle cx="142" cy="129" r="7" class="node"/><circle cx="196" cy="171" r="7" class="node"/><circle cx="248" cy="214" r="7" class="node"/>
    <rect x="120" y="107" width="44" height="39" rx="3" fill="none" stroke="#566a92" stroke-width="2"/>
    <rect x="175" y="151" width="44" height="39" rx="3" fill="#566a92" stroke="#566a92" stroke-width="2"/>
    <rect x="226" y="194" width="44" height="39" rx="3" fill="none" stroke="#b8b1a4" stroke-width="2"/>
    <path d="M181 170l8 8 16-18" fill="none" stroke="#f1eee7" stroke-width="3"/>
    <text x="18" y="266" class="tiny muted">Judge the prototype against the need.</text>
  </g>
  <g transform="translate(1200 770)">
    <use href="#framebase"/>
    <text x="18" y="29" class="label muted">08 · 0:49.2–0:55.0</text>
    <text x="18" y="68" class="headline">Learn Figma. Keep going.</text>
    <text x="18" y="96" class="small">Pull back to reveal the whole map.</text>
    <path d="M-12 202 H54 L108 174 L164 201 L223 154 L282 174 L343 147" class="route"/>
    <circle cx="54" cy="202" r="8" class="node"/><circle cx="108" cy="174" r="8" class="node"/><circle cx="164" cy="201" r="8" class="node"/><circle cx="223" cy="154" r="8" class="node"/><circle cx="282" cy="174" r="8" class="node"/>
    <text x="27" y="231" class="tiny muted">FIGMA</text>
    <text x="30" y="271" class="label red">OBSERVE · QUESTION · DECIDE</text>
  </g>
  <text x="54" y="1390" class="tiny muted">All interface panels are explanatory artwork. Source footage, verified reference images, and product marks are pending.</text>
  <text x="1544" y="1390" text-anchor="end" class="tiny muted">1080 × 1920 VIDEO MASTER</text>
</svg>
